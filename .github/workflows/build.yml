          cat > make_icon.py << 'EOF_PY'
          import glob
          from PIL import Image
          f = (glob.glob('*.jpg') + glob.glob('*.jpeg') + glob.glob('*.png'))[0]
          im = Image.open(f).convert('RGB')
          w, h = im.size
          s = min(w, h)
          l = (w - s) // 2
          t = (h - s) // 2
          im.crop((l, t, l + s, t + s)).resize((192, 192)).save('app/src/main/res/drawable-nodpi/icone.png')
          EOF_PY
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install -q --break-system-packages pillow || true
