      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Publicar o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Alerta Captcha (build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/app-debug.apk
          
